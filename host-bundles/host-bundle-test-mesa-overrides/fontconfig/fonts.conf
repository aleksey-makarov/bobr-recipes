<?xml version="1.0"?>
<fontconfig>
  <!-- This file is copied to overrides/fontconfig/fonts.conf. Keep the font
       directory relative so the complete HostBundle remains relocatable. -->
  <dir prefix="relative">../../root/usr/share/fonts</dir>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <!-- Pango/libdecor commonly asks for the shorter generic name "sans". -->
  <match target="pattern">
    <test name="family" compare="eq">
      <string>sans</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" compare="eq">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>DejaVu Sans Mono</string>
    </edit>
  </match>

  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
